services:
  api:
    build:
      context: ./Week9_ResilientOrdersApi
    ports:
      - "8090:8080"
    environment:
      - Seq__ServerUrl=http://seq:80
      - Temporal__HostPort=temporal:7233
      - Smtp__Host=smtp4dev
      - Smtp__Port=25
    depends_on:
      - seq
      - temporal
      - smtp4dev

  seq:
    image: datalust/seq:latest
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true # skip admin login for local dev
    ports:
      - "5341:80" # Seq UI: http://localhost:5341

  temporal:
    image: temporalio/temporal:latest
    command: server start-dev --ip 0.0.0.0
    ports:
      - "7233:7233" # gRPC port, used by the API
      - "8233:8233" # Temporal UI: http://localhost:8233

  smtp4dev:
    image: rnwood/smtp4dev:latest
    ports:
      - "5000:80" # smtp4dev UI: http://localhost:5000
      - "2525:25" # SMTP port
